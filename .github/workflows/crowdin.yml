name: Crowdin Action

on:
  workflow_dispatch: {}
  schedule:
    # runs every day
    - cron: '0 4 * * *'

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.credentials.outputs.enabled }}

    steps:
      - name: Check Crowdin credentials
        id: credentials
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ] && [ -n "$CROWDIN_PROJECT_ID" ] && [ -n "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: git config
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - name: Sync from official repo
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          git pull --unshallow
          git remote add official https://github.com/stakira/OpenUtau
          git fetch official
          git merge --no-edit official/master

      - if: steps.credentials.outputs.enabled == 'true'
        run: ls -l OpenUtau/Strings
      
      - name: crowdin action
        if: steps.credentials.outputs.enabled == 'true'
        uses: crowdin/github-action@v2.5.0
        with:
          upload_sources: true
          upload_sources_args: --auto-update
          upload_translations: false
          download_translations: true
          localization_branch_name: crowdin-translated
          create_pull_request: false
        env:
          # A classic GitHub Personal Access Token with the 'repo' scope selected (the user should have write access to the repository).
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          
          # A numeric ID, found at https://crowdin.com/project/<projectName>/tools/api
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}

          # Visit https://crowdin.com/settings#api-key to create this token
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  sync-strings:
    needs: [synchronize-with-crowdin]
    if: needs.synchronize-with-crowdin.outputs.enabled == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: crowdin-translated
          
      - name: Run sync_strings.py
        run: python Misc/sync_strings.py
      
      - name: git config
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
      - name: git commit
        run: |
          git add .
          git commit -m "sync strings"

      - name: git push
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          branch: crowdin-translated
